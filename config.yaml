# config.yaml
# Single Source of Truth for SmartScholar Configuration

profiles:
  fast:
    max_queries: 3
    top_n_papers: 3
    read_depth: abstract
    chunk_size: 1024
    max_loops: 1
    critic_pass_threshold: 50
    critic_top_k: 2

  medium:
    max_queries: 5
    top_n_papers: 5
    read_depth: hybrid
    # Thema B: of the top_n_papers active papers (ranked by relevance), only
    # the top full_text_top_n get the full-text PDF; the rest are ingested as
    # abstract only. PDF and abstract are never stored together for one paper.
    # (Ignored by fast/pro, whose read_depth fixes the full-text count anyway.)
    full_text_top_n: 3
    chunk_size: 512
    max_loops: 2
    critic_pass_threshold: 60
    critic_top_k: 3

  pro:
    max_queries: 10
    top_n_papers: 10
    read_depth: full_pdf
    chunk_size: 256
    max_loops: 3
    critic_pass_threshold: 70
    critic_top_k: 5